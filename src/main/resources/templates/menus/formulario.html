<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Datos del menú')}"></head>
<body class="app-layout">
<th:block th:replace="~{fragments/layout :: header('menus')}"></th:block>
<div class="app-content">
    <main id="contenido-principal" class="app-main">
        <div class="page-heading">
            <p class="page-eyebrow mb-2">ALIMENTACIÓN / MENÚS</p>
            <h1 class="mb-2" th:text="${creacion ? 'Agregar menú' : 'Editar menú'}"></h1>
            <p class="text-body-secondary mb-0">El menú se registra en borrador; actívelo cuando tenga sus tiempos de comida.</p>
        </div>
        <div class="card form-card">
            <div class="card-body">
                <form th:action="@{${accion}}" th:object="${formulario}" method="post">
                    <div class="alert alert-danger" role="alert" th:if="${#fields.hasErrors('*')}">
                        <p class="mb-1 fw-semibold">Revise los datos del formulario.</p>
                        <ul class="mb-0">
                            <li th:each="error : ${#fields.errors('*')}" th:text="${error}"></li>
                        </ul>
                    </div>
                    <div class="row g-4">
                        <div class="col-md-12">
                            <label for="nombre" class="form-label">Nombre del menú</label>
                            <input id="nombre" type="text" class="form-control" th:field="*{nombre}"
                                   th:errorclass="is-invalid" maxlength="150" autocomplete="off" required>
                        </div>
                        <div class="col-md-6">
                            <label for="tipoDieta" class="form-label">Tipo de dieta</label>
                            <select id="tipoDieta" class="form-select" th:field="*{tipoDieta}" th:errorclass="is-invalid" required>
                                <option value="">Seleccione un tipo de dieta</option>
                                <option th:each="tipo : ${tiposDieta}" th:value="${tipo}" th:text="${tipo.etiqueta}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="tipo" class="form-label">Tipo de menú</label>
                            <select id="tipo" class="form-select" th:field="*{tipo}" th:errorclass="is-invalid" required>
                                <option th:each="tipo : ${tipos}" th:value="${tipo}"
                                        th:text="${tipo.name() == 'GENERAL' ? 'General' : 'Personalizado'}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="border-top mt-4 pt-4 d-flex flex-wrap gap-2">
                        <button class="btn btn-primary" type="submit">Guardar menú</button>
                        <a class="btn btn-outline-secondary" th:href="@{/menus}">Volver a menús</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
