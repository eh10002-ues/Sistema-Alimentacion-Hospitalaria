<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<main class="container login">
    <h1>Iniciar sesión</h1>

    <p class="alert alert-error" th:if="${param.error}">Usuario o contraseña incorrectos.</p>
    <p class="alert alert-info" th:if="${param.logout}">Sesión cerrada correctamente.</p>

    <form th:action="@{/login}" method="post">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <button type="submit" class="btn">Ingresar</button>
    </form>
</main>
</body>
</html>
