<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body class="auth-layout">
<main id="contenido-principal" class="auth-shell mx-auto">
    <div>
        <div class="d-flex align-items-center gap-3 mb-4 justify-content-center">
            <span class="brand-mark" aria-hidden="true">AH</span>
            <div><strong class="d-block">Alimentación Hospitalaria</strong><span class="small text-body-secondary">Acceso al sistema</span></div>
        </div>
        <section class="card auth-card">
            <div class="card-body">
                <h1 class="h3 mb-2">Iniciar sesión</h1>
                <p class="text-body-secondary small mb-4">Ingrese sus credenciales para continuar.</p>
                <p class="alert alert-danger" role="alert" th:if="${param.error}">Usuario o contraseña incorrectos.</p>
                <p class="alert alert-success" role="status" th:if="${param.logout}">Sesión cerrada correctamente.</p>
                <p class="alert alert-info" role="status" th:if="${param.expired}">Su sesión ha finalizado porque la información de su cuenta fue actualizada. Inicie sesión nuevamente.</p>
                <form th:action="@{/login}" method="post" class="vstack gap-3">
                    <div>
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" id="username" name="username" class="form-control" autocomplete="username" required autofocus>
                    </div>
                    <div>
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-2">Ingresar</button>
                </form>
            </div>
        </section>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
