<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Panel principal')}"></head>
<body class="app-layout">
<th:block th:replace="~{fragments/layout :: header('inicio')}"></th:block>
<div class="app-content">
    <main id="contenido-principal" class="app-main">
        <div class="page-heading">
            <p class="page-eyebrow mb-2">INICIO</p>
            <h1 class="mb-2" th:text="${panel.titulo}"></h1>
            <p class="text-body-secondary mb-3" th:text="${panel.descripcion}"></p>
            <span class="rol-panel" th:text="${panel.rol.etiqueta}"></span>
        </div>
        <div class="row g-4">
            <div class="col-xl-5">
                <section class="card h-100" aria-labelledby="cuenta-titulo">
                    <div class="card-body">
                        <h2 id="cuenta-titulo" class="mb-4">Su cuenta</h2>
                        <dl class="account-details row g-4 mb-0">
                            <div class="col-sm-6 col-xl-12"><dt>Usuario</dt><dd th:text="${panel.usuario}"></dd></div>
                            <div class="col-sm-6 col-xl-12"><dt>Rol</dt><dd th:text="${panel.rol.etiqueta}"></dd></div>
                        </dl>
                    </div>
                </section>
            </div>
            <div class="col-xl-7">
                <section class="card h-100" aria-labelledby="funciones-titulo">
                    <div class="card-body">
                        <h2 id="funciones-titulo" class="mb-2">Funciones de su rol</h2>
                        <ul class="functions-list"><li th:each="funcion : ${panel.funciones}" th:text="${funcion}"></li></ul>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
