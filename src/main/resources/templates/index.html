<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Panel principal')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <p class="rol-panel" th:text="${panel.rol.etiqueta}"></p>
    <h1 th:text="${panel.titulo}"></h1>
    <p th:text="${panel.descripcion}"></p>
    <section class="panel-cuenta" aria-labelledby="cuenta-titulo">
        <h2 id="cuenta-titulo">Su cuenta</h2>
        <dl><dt>Usuario</dt><dd th:text="${panel.usuario}"></dd>
            <dt>Rol</dt><dd th:text="${panel.rol.etiqueta}"></dd></dl>
    </section>
    <section th:unless="${#lists.isEmpty(panel.accesos)}" aria-labelledby="accesos-titulo">
        <h2 id="accesos-titulo">Accesos disponibles</h2>
        <div class="accesos-panel">
            <a class="btn" th:each="acceso : ${panel.accesos}" th:href="@{${acceso.ruta}}" th:text="${acceso.titulo}"></a>
        </div>
    </section>
    <section aria-labelledby="funciones-titulo">
        <h2 id="funciones-titulo">Funciones de su rol</h2>
        <ul><li th:each="funcion : ${panel.funciones}" th:text="${funcion}"></li></ul>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
