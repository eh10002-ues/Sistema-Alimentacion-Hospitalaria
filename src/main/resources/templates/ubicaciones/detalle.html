<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Detalle del piso')}"></head>
<body class="app-layout">
<th:block th:replace="~{fragments/layout :: header('ubicaciones')}"></th:block>
<div class="app-content">
    <main id="contenido-principal" class="app-main">
        <div class="page-heading d-flex flex-wrap justify-content-between align-items-end gap-3">
            <div>
                <p class="page-eyebrow mb-2">ADMINISTRACIÓN / PISOS Y CAMAS</p>
                <h1 class="mb-0" th:text="|Piso ${detalle.piso.nombre} - ${detalle.piso.codigo}|"></h1>
            </div>
            <a class="btn btn-outline-secondary" th:href="@{/admin/ubicaciones}">Volver a pisos</a>
        </div>

        <section class="card mb-4" aria-labelledby="informacion-piso">
            <div class="card-header bg-white"><h2 id="informacion-piso" class="h5 mb-0">Información del piso</h2></div>
            <div class="card-body">
                <dl class="row mb-0">
                    <dt class="col-sm-3">Código</dt><dd class="col-sm-9" th:text="${detalle.piso.codigo}"></dd>
                    <dt class="col-sm-3">Nombre</dt><dd class="col-sm-9" th:text="${detalle.piso.nombre}"></dd>
                </dl>
            </div>
        </section>

        <section class="card mb-4" aria-labelledby="encargados-piso">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h2 id="encargados-piso" class="h5 mb-0">Encargados y turnos</h2>
                <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/ubicaciones/{id}/encargados(id=${detalle.piso.id})}">Gestionar encargados</a>
            </div>
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead><tr><th>Usuario</th><th>Nombre completo</th><th>Turno</th></tr></thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(detalle.encargados)}"><td colspan="3" class="text-center text-body-secondary py-4">Este piso no tiene encargados asignados.</td></tr>
                    <tr th:each="encargado : ${detalle.encargados}">
                        <td th:text="${encargado.nombreUsuario}"></td>
                        <td th:text="${encargado.nombreCompleto}"></td>
                        <td th:text="${encargado.turno}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="card" aria-labelledby="camas-piso">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h2 id="camas-piso" class="h5 mb-0">Camas registradas</h2>
                <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/ubicaciones/{id}/camas/nueva(id=${detalle.piso.id})}">Gestionar camas</a>
            </div>
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead><tr><th>Código de cama</th></tr></thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(detalle.camas)}"><td class="text-center text-body-secondary py-4">Este piso no tiene camas registradas.</td></tr>
                    <tr th:each="cama : ${detalle.camas}"><td th:text="${cama.numero}"></td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
