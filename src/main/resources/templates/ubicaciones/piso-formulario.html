<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Datos del piso')}"></head>
<body class="app-layout">
<th:block th:replace="~{fragments/layout :: header('ubicaciones')}"></th:block>
<div class="app-content">
    <main id="contenido-principal" class="app-main">
        <div class="page-heading">
            <p class="page-eyebrow mb-2">ADMINISTRACIÓN / PISOS Y CAMAS</p>
            <h1 class="mb-2" th:text="${creacion ? 'Agregar piso' : 'Editar piso'}"></h1>
            <p class="text-body-secondary mb-0">Defina la identificación visible del piso.</p>
        </div>
        <div class="card form-card">
            <div class="card-body">
                <form th:action="@{${accion}}" th:object="${formulario}" method="post">
                    <div class="alert alert-danger" role="alert" th:if="${#fields.hasErrors('*')}">
                        <p class="mb-1 fw-semibold">Revise los datos del formulario.</p>
                        <p class="mb-0" th:each="error : ${#fields.errors('*')}" th:text="${error}"></p>
                    </div>
                    <div class="row g-4">
                        <div class="col-md-4">
                            <label for="codigo" class="form-label">Código del piso</label>
                            <input id="codigo" type="text" class="form-control" th:field="*{codigo}" maxlength="10"
                                   th:errorclass="is-invalid" required>
                        </div>
                        <div class="col-md-8">
                            <label for="nombre" class="form-label">Nombre del piso</label>
                            <input id="nombre" type="text" class="form-control" th:field="*{nombre}" maxlength="100"
                                   th:errorclass="is-invalid" required>
                        </div>
                    </div>
                    <div class="border-top mt-4 pt-4 d-flex flex-wrap gap-2">
                        <button class="btn btn-primary" type="submit">Guardar piso</button>
                        <a class="btn btn-outline-secondary" th:href="@{/admin/ubicaciones}">Volver a pisos</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
