<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Agregar camas')}"></head>
<body class="app-layout">
<th:block th:replace="~{fragments/layout :: header('ubicaciones')}"></th:block>
<div class="app-content">
    <main id="contenido-principal" class="app-main">
        <div class="page-heading">
            <p class="page-eyebrow mb-2">ADMINISTRACIÓN / UBICACIONES</p>
            <h1 class="mb-2">Agregar camas</h1>
            <p class="text-body-secondary mb-0" th:text="|Piso: ${piso.codigo} - ${piso.nombre}|"></p>
        </div>
        <div class="card form-card">
            <div class="card-body">
                <form th:action="@{/admin/ubicaciones/{id}/camas(id=${piso.id})}" th:object="${formulario}" method="post">
                    <div class="alert alert-danger" role="alert" th:if="${#fields.hasErrors('*')}">
                        <span th:each="error : ${#fields.allErrors()}" th:text="${error.defaultMessage}"></span>
                    </div>
                    <div id="camas" class="vstack gap-3">
                        <div class="cama-fila" th:each="cama, item : *{camas}">
                            <label th:for="|numero-${item.index}|" class="form-label">Código de la cama</label>
                            <div class="input-group">
                                <input th:id="|numero-${item.index}|" type="text" class="form-control"
                                       th:field="*{camas[__${item.index}__].numero}" maxlength="10" required>
                                <button th:if="${item.index > 0}" type="button" class="btn btn-outline-danger quitar-cama"
                                        aria-label="Quitar cama">&times;</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-text">El código debe ser único dentro de este piso.</div>
                    <button id="agregar-cama" type="button" class="btn btn-outline-secondary mt-3">Agregar otra cama</button>
                    <div class="border-top mt-4 pt-4 d-flex flex-wrap gap-2">
                        <button class="btn btn-primary" type="submit">Registrar cama</button>
                        <a class="btn btn-outline-secondary" th:href="@{/admin/ubicaciones}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
const contenedor = document.getElementById('camas');
document.getElementById('agregar-cama').addEventListener('click', () => {
    const indice = contenedor.querySelectorAll('.cama-fila').length;
    const fila = document.createElement('div');
    fila.className = 'cama-fila';
    fila.innerHTML = `<label for="numero-${indice}" class="form-label">Código de la cama</label>
        <div class="input-group">
            <input id="numero-${indice}" name="camas[${indice}].numero" type="text" class="form-control"
                   maxlength="10" required>
            <button type="button" class="btn btn-outline-danger quitar-cama" aria-label="Quitar cama">&times;</button>
        </div>`;
    contenedor.appendChild(fila);
});
contenedor.addEventListener('click', evento => {
    if (evento.target.closest('.quitar-cama')) {
        evento.target.closest('.cama-fila').remove();
    }
});
</script>
</body>
</html>
