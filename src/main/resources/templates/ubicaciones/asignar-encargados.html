<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Asignar encargados')}"></head>
<body class="app-layout">
<th:block th:replace="~{fragments/layout :: header('ubicaciones')}"></th:block>
<div class="app-content">
    <main id="contenido-principal" class="app-main">
        <div class="page-heading">
            <p class="page-eyebrow mb-2">ADMINISTRACIÓN / UBICACIONES</p>
            <h1 class="mb-2">Asignar encargados</h1>
            <p class="text-body-secondary mb-0" th:text="|Piso: ${piso.codigo} - ${piso.nombre}|"></p>
        </div>
        <div class="card form-card">
            <div class="card-body">
                <form th:action="@{/admin/ubicaciones/{id}/encargados(id=${piso.id})}" th:object="${formulario}" method="post">
                    <div class="alert alert-danger" role="alert" th:if="${#fields.hasErrors('*')}"
                         th:each="error : ${#fields.allErrors()}" th:text="${error.defaultMessage}"></div>
                    <div class="alert alert-info">Solo se muestran usuarios activos con rol Encargado de piso.</div>
                    <div id="asignaciones" class="vstack gap-3">
                        <div class="row g-3 align-items-end asignacion-fila" th:each="asignacion, item : *{asignaciones}">
                            <div class="col-md-7">
                                <label th:for="|usuario-${item.index}|" class="form-label">Usuario encargado</label>
                                <select th:id="|usuario-${item.index}|" th:field="*{asignaciones[__${item.index}__].usuarioId}" class="form-select" required>
                                    <option value="">Seleccione un usuario</option>
                                    <option th:each="usuario : ${encargados}" th:value="${usuario.id}"
                                            th:text="|${usuario.nombreCompleto} (${usuario.nombreUsuario})|"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label th:for="|turno-${item.index}|" class="form-label">Turno</label>
                                <select th:id="|turno-${item.index}|" th:field="*{asignaciones[__${item.index}__].turno}" class="form-select" required>
                                    <option value="">Seleccione un turno</option>
                                    <option th:each="turno : ${turnos}" th:value="${turno}" th:text="${turno}"></option>
                                </select>
                            </div>
                            <div class="col-md-1" th:if="${item.index > 0}">
                                <button type="button" class="btn btn-outline-danger w-100 quitar-asignacion" aria-label="Quitar asignación">&times;</button>
                            </div>
                        </div>
                    </div>
                    <button id="agregar-asignacion" type="button" class="btn btn-outline-secondary mt-3">Agregar otro encargado</button>
                    <div class="border-top mt-4 pt-4 d-flex flex-wrap gap-2">
                        <button class="btn btn-primary" type="submit">Guardar asignaciones</button>
                        <a class="btn btn-outline-secondary" th:href="@{/admin/ubicaciones}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:inline="javascript">
/*<![CDATA[*/
const opcionesUsuarios = /*[[${encargados}]]*/[];
const opcionesTurnos = /*[[${turnos}]]*/[];
const contenedor = document.getElementById('asignaciones');
const escapar = valor => String(valor).replace(/[&<>"']/g, caracter => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
}[caracter]));

document.getElementById('agregar-asignacion').addEventListener('click', () => {
    const indice = contenedor.querySelectorAll('.asignacion-fila').length;
    const fila = document.createElement('div');
    fila.className = 'row g-3 align-items-end asignacion-fila';
    let usuarios = '<option value="">Seleccione un usuario</option>';
    opcionesUsuarios.forEach(usuario => usuarios += `<option value="${escapar(usuario.id)}">${escapar(usuario.nombreCompleto)} (${escapar(usuario.nombreUsuario)})</option>`);
    let turnos = '<option value="">Seleccione un turno</option>';
    opcionesTurnos.forEach(turno => turnos += `<option value="${turno}">${turno}</option>`);
    fila.innerHTML = `<div class="col-md-7"><label for="usuario-${indice}" class="form-label">Usuario encargado</label>
        <select id="usuario-${indice}" name="asignaciones[${indice}].usuarioId" class="form-select" required>${usuarios}</select></div>
        <div class="col-md-4"><label for="turno-${indice}" class="form-label">Turno</label>
        <select id="turno-${indice}" name="asignaciones[${indice}].turno" class="form-select" required>${turnos}</select></div>
        <div class="col-md-1"><button type="button" class="btn btn-outline-danger w-100 quitar-asignacion" aria-label="Quitar asignación">&times;</button></div>`;
    contenedor.appendChild(fila);
});

contenedor.addEventListener('click', evento => {
    if (evento.target.closest('.quitar-asignacion')) {
        evento.target.closest('.asignacion-fila').remove();
    }
});
/*]]>*/
</script>
</body>
</html>
