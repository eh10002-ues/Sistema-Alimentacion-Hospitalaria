<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Restablecer contraseña')}"></head>
<body class="app-layout">
<th:block th:replace="~{fragments/layout :: header('usuarios')}"></th:block>
<div class="app-content">
    <main id="contenido-principal" class="app-main">
        <div class="page-heading">
            <p class="page-eyebrow mb-2">ADMINISTRACIÓN / USUARIOS</p>
            <h1 class="mb-2">Restablecer contraseña</h1>
            <p class="text-body-secondary mb-0">Usuario: <strong class="text-body" th:text="${usuario.nombreUsuario}"></strong></p>
        </div>
        <div class="card form-card">
            <div class="card-body">
                <p class="alert alert-warning">Al guardar, todas las sesiones de esta cuenta finalizarán. No se puede consultar la contraseña anterior.</p>
                <p class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></p>
                <form th:action="@{/admin/usuarios/{id}/restablecer-password(id=${usuario.id})}" method="post">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label for="contrasena" class="form-label">Nueva contraseña temporal</label>
                            <input id="contrasena" name="contrasena" type="password" class="form-control" autocomplete="new-password" aria-describedby="politica-contrasena" required>
                        </div>
                        <div class="col-md-6">
                            <label for="confirmacion" class="form-label">Confirmar contraseña temporal</label>
                            <input id="confirmacion" name="confirmacion" type="password" class="form-control" autocomplete="new-password" required>
                        </div>
                    </div>
                    <p id="politica-contrasena" class="form-text mt-3" th:text="${politicaContrasena}"></p>
                    <div class="border-top mt-4 pt-4 d-flex flex-wrap gap-2">
                        <button class="btn btn-primary" type="submit">Restablecer contraseña</button>
                        <a class="btn btn-outline-secondary" th:href="@{/admin/usuarios}">Volver a usuarios</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
