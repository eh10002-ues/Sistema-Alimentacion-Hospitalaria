<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Administración de usuarios')}"></head>
<body class="app-layout">
<th:block th:replace="~{fragments/layout :: header('usuarios')}"></th:block>
<div class="app-content">
    <main id="contenido-principal" class="app-main">
        <div class="page-heading d-flex flex-wrap justify-content-between align-items-end gap-3">
            <div>
                <p class="page-eyebrow mb-2">ADMINISTRACIÓN</p>
                <h1 class="mb-2">Administración de usuarios</h1>
                <p class="text-body-secondary mb-0">Gestione las cuentas, sus roles y el acceso al sistema.</p>
            </div>
            <a class="btn btn-primary" th:href="@{/admin/usuarios/nuevo}">Crear usuario</a>
        </div>
        <p class="alert alert-success" role="status" th:if="${mensaje}" th:text="${mensaje}"></p>
        <p class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></p>
        <div class="card overflow-hidden">
            <div class="table-responsive">
                <table class="table align-middle mb-0 user-table">
                    <caption class="visually-hidden">Usuarios registrados y acciones de administración</caption>
                    <thead><tr><th scope="col">Usuario</th><th scope="col">Nombre completo</th><th scope="col">Rol</th><th scope="col">Estado</th><th scope="col">Acciones</th></tr></thead>
                    <tbody>
                    <tr th:if="${pagina.empty}"><td colspan="5" class="text-center text-body-secondary py-5">No hay usuarios para mostrar.</td></tr>
                    <tr th:each="usuario : ${pagina.content}">
                        <td class="fw-semibold" th:text="${usuario.nombreUsuario}"></td>
                        <td th:text="${usuario.nombreCompleto}"></td>
                        <td th:text="${usuario.rol.etiqueta}"></td>
                        <td><span class="badge rounded-pill" th:classappend="${usuario.activo} ? 'bg-success-subtle text-success-emphasis' : 'bg-secondary-subtle text-secondary-emphasis'"
                                  th:text="${usuario.activo ? 'Activo' : 'Inactivo'}"></span></td>
                        <td class="table-actions">
                            <div class="d-flex flex-wrap align-items-center gap-2">
                                <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/usuarios/{id}/editar(id=${usuario.id})}">Editar</a>
                                <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/usuarios/{id}/restablecer-password(id=${usuario.id})}">Restablecer contraseña</a>
                                <form th:if="${usuario.activo}" th:action="@{/admin/usuarios/{id}/desactivar(id=${usuario.id})}" method="post" class="m-0">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Desactivar</button>
                                </form>
                                <form th:unless="${usuario.activo}" th:action="@{/admin/usuarios/{id}/activar(id=${usuario.id})}" method="post" class="m-0">
                                    <button type="submit" class="btn btn-sm btn-outline-success">Activar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer bg-white d-flex flex-wrap align-items-center justify-content-between gap-3 py-3 px-4">
                <span class="small text-body-secondary" th:text="|Página ${pagina.number + 1} · ${pagina.totalElements} usuarios|"></span>
                <nav aria-label="Páginas de usuarios">
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:if="${pagina.hasPrevious()}"><a class="page-link" th:href="@{/admin/usuarios(pagina=${pagina.number - 1})}">Anterior</a></li>
                        <li class="page-item" th:if="${pagina.hasNext()}"><a class="page-link" th:href="@{/admin/usuarios(pagina=${pagina.number + 1})}">Siguiente</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
