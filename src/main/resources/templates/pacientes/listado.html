<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Pacientes')}"></head>
<body class="app-layout">
<th:block th:replace="~{fragments/layout :: header('pacientes')}"></th:block>
<div class="app-content">
    <main id="contenido-principal" class="app-main">
        <div class="page-heading d-flex flex-wrap justify-content-between align-items-end gap-3">
            <div>
                <p class="page-eyebrow mb-2">PACIENTES</p>
                <h1 class="mb-2">Gestionar pacientes</h1>
                <p class="text-body-secondary mb-0">Consulte los pacientes, su ubicación y su información clínica.</p>
            </div>
        </div>

        <form class="card card-body mb-3" th:action="@{/pacientes}" method="get">
            <div class="row g-3 align-items-end">
                <div class="col-md">
                    <label for="buscar" class="form-label">Buscar paciente</label>
                    <input id="buscar" name="buscar" type="search" class="form-control"
                           th:value="${buscar}" placeholder="Código, nombre o apellido">
                </div>
                <div class="col-md-auto">
                    <label for="estado" class="form-label">Estado</label>
                    <select id="estado" name="estado" class="form-select">
                        <option th:value="${null}" th:selected="${estadoSeleccionado == null}">Todos</option>
                        <option th:each="estadoItem : ${estados}" th:value="${estadoItem}"
                                th:selected="${estadoItem == estadoSeleccionado}" th:text="${estadoItem}"></option>
                    </select>
                </div>
                <div class="col-md-auto">
                    <button class="btn btn-primary" type="submit">Buscar</button>
                </div>
            </div>
        </form>

        <div class="card overflow-hidden">
            <div class="table-responsive">
                <table class="table align-middle mb-0 pacientes-table">
                    <caption class="visually-hidden">Pacientes registrados y sus datos principales</caption>
                    <thead>
                    <tr>
                        <th scope="col">Código</th>
                        <th scope="col">Nombre</th>
                        <th scope="col">Apellido</th>
                        <th scope="col">Enfermedades</th>
                        <th scope="col">Alergias</th>
                        <th scope="col">Ubicación</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${pagina.empty}">
                        <td colspan="8" class="text-center text-body-secondary py-5">No hay pacientes para mostrar.</td>
                    </tr>
                    <tr th:each="paciente : ${pagina.content}">
                        <td class="fw-semibold" th:text="${paciente.codigo}"></td>
                        <td class="paciente-nombre" th:text="${paciente.nombres}"></td>
                        <td th:text="${paciente.apellidos}"></td>
                        <td th:text="${paciente.enfermedades}"></td>
                        <td th:text="${paciente.alergias}"></td>
                        <td th:text="${paciente.ubicacion}"></td>
                        <td>
                            <span class="badge rounded-pill"
                                  th:classappend="${paciente.estado.name() == 'INGRESADO'} ? 'text-bg-warning' : 'text-bg-success'"
                                  th:text="${paciente.estado}"></span>
                        </td>
                        <td><a class="btn btn-sm btn-outline-primary" th:href="@{/pacientes/{id}(id=${paciente.id})}">Ver Paciente</a></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer bg-white d-flex flex-wrap align-items-center justify-content-between gap-3 py-3 px-4">
                <span class="small text-body-secondary" th:text="|Página ${pagina.number + 1} · ${pagina.totalElements} pacientes|"></span>
                <nav aria-label="Páginas de pacientes">
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:if="${pagina.hasPrevious()}">
                            <a class="page-link" th:href="@{/pacientes(pagina=${pagina.number - 1},buscar=${buscar},estado=${estadoSeleccionado})}">Anterior</a>
                        </li>
                        <li class="page-item" th:if="${pagina.hasNext()}">
                            <a class="page-link" th:href="@{/pacientes(pagina=${pagina.number + 1},buscar=${buscar},estado=${estadoSeleccionado})}">Siguiente</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
