<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Gestionar enfermedades')}"></head>
<body class="app-layout">
<th:block th:replace="~{fragments/layout :: header('pacientes')}"></th:block>
<div class="app-content">
    <main id="contenido-principal" class="app-main">
        <div class="page-heading">
            <p class="page-eyebrow mb-2">PACIENTES / ENFERMEDADES</p>
            <h1 class="mb-2">Gestionar enfermedades</h1>
            <p class="text-body-secondary mb-0"
               th:text="|${paciente.nombres} ${paciente.apellidos} · ${paciente.codigo}|"></p>
            <div class="d-flex flex-wrap gap-2 mt-3">
                <a class="btn btn-secondary"
                   th:href="@{/pacientes/{id}(id=${paciente.id})}">Ver Paciente</a>
                <a class="btn btn-outline-success"
                   th:href="@{/pacientes/{id}/alergias(id=${paciente.id})}">Gestionar Alergias</a>
                <a class="btn btn-primary"
                   th:href="@{/pacientes/{id}/enfermedades(id=${paciente.id})}">Gestionar Enfermedades</a>
                <a class="btn btn-outline-success"
                   th:href="@{/pacientes/{id}/medicamentos(id=${paciente.id})}">Gestionar Medicamentos</a>
            </div>
        </div>

        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

        <div class="card mb-4">
            <div class="card-header bg-white"><h2 class="h5 mb-0">Agregar enfermedad</h2></div>
            <div class="card-body">
                <form th:action="@{/pacientes/{id}/enfermedades(id=${paciente.id})}"
                      th:object="${formulario}" method="post">
                    <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
                        <span th:each="error : ${#fields.errors('*')}" th:text="${error}" class="d-block"></span>
                    </div>
                    <div>
                        <label for="nombreEnfermedad" class="form-label">Nombre</label>
                        <input id="nombreEnfermedad" class="form-control" th:field="*{nombre}"
                               maxlength="150" required>
                    </div>
                    <button class="btn btn-primary mt-3" type="submit">Agregar enfermedad</button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-white"><h2 class="h5 mb-0">Enfermedades registradas</h2></div>
            <div class="table-responsive enfermedades-table">
                <table class="table align-middle mb-0">
                    <thead><tr><th>Nombre</th><th>Acciones</th></tr></thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(enfermedades)}">
                        <td colspan="2" class="text-center text-body-secondary py-4">No hay enfermedades registradas.</td>
                    </tr>
                    <tr th:each="enfermedad : ${enfermedades}">
                        <td th:text="${enfermedad.nombre}"></td>
                        <td>
                            <div class="dropdown">
                                <button class="btn btn-sm btn-outline-primary dropdown-toggle" type="button"
                                        data-bs-toggle="dropdown">Acciones</button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li>
                                        <button class="dropdown-item" type="button" data-bs-toggle="collapse"
                                                th:data-bs-target="|#editar-${enfermedad.id}|">Editar</button>
                                    </li>
                                    <li>
                                        <form th:action="@{/pacientes/{id}/enfermedades/{enfermedadId}/eliminar(id=${paciente.id},enfermedadId=${enfermedad.id})}"
                                              method="post" onsubmit="return confirm('¿Eliminar esta enfermedad?');">
                                            <button class="dropdown-item text-danger" type="submit">Eliminar</button>
                                        </form>
                                    </li>
                                </ul>
                            </div>
                            <div class="collapse px-3 pb-3" th:id="|editar-${enfermedad.id}|">
                                <form th:action="@{/pacientes/{id}/enfermedades/{enfermedadId}/editar(id=${paciente.id},enfermedadId=${enfermedad.id})}"
                                      method="post" class="row g-3">
                                    <div class="col-md-9">
                                        <label th:for="|nombre-${enfermedad.id}|" class="form-label">Nombre</label>
                                        <input th:id="|nombre-${enfermedad.id}|" name="nombre" class="form-control"
                                               th:value="${enfermedad.nombre}" maxlength="150" required>
                                    </div>
                                    <div class="col-md-3 d-flex align-items-end">
                                        <button class="btn btn-primary btn-sm" type="submit">Guardar cambios</button>
                                    </div>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <a class="btn btn-outline-secondary mt-3" th:href="@{/pacientes}">Volver</a>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
