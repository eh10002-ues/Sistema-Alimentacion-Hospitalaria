<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Prescripción de dieta')}"></head>
<body class="app-layout">
<th:block th:replace="~{fragments/layout :: header('prescripciones')}"></th:block>
<div class="app-content">
    <main id="contenido-principal" class="app-main">
        <div class="page-heading">
            <p class="page-eyebrow mb-2">PRESCRIPCIÓN DE DIETA</p>
            <h1 class="mb-2">Pacientes ingresados</h1>
            <p class="text-body-secondary mb-0">Seleccione un paciente para evaluarlo y autorizar su régimen dietético.</p>
        </div>
        <div class="card overflow-hidden">
            <div class="table-responsive">
                <table class="table align-middle mb-0 user-table">
                    <caption class="visually-hidden">Pacientes ingresados disponibles para prescripción de dieta</caption>
                    <thead><tr><th scope="col">Código</th><th scope="col">Paciente</th><th scope="col">Ubicación</th><th scope="col">Acciones</th></tr></thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(pacientes)}"><td colspan="4" class="text-center text-body-secondary py-5">No hay pacientes ingresados.</td></tr>
                    <tr th:each="paciente : ${pacientes}">
                        <td class="fw-semibold" th:text="${paciente.codigo}"></td>
                        <td th:text="${paciente.nombreCompleto}"></td>
                        <td th:text="${paciente.ubicacion}"></td>
                        <td class="table-actions">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/prescripciones/pacientes/{id}(id=${paciente.id})}">Evaluar</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
