<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Órdenes en tiempo real')}"></head>
<body class="app-layout">
<th:block th:replace="~{fragments/layout :: header('cocina')}"></th:block>
<div class="app-content">
    <main id="contenido-principal" class="app-main">
        <div class="page-heading">
            <p class="page-eyebrow mb-2">COCINA</p>
            <h1 class="mb-2">Órdenes de dieta aprobadas</h1>
            <p class="text-body-secondary mb-0">Las dietas autorizadas aparecen aquí al instante mientras la página permanece abierta.</p>
        </div>
        <p id="estado-conexion" class="alert alert-secondary" role="status">Conectando…</p>
        <div class="card overflow-hidden">
            <div class="table-responsive">
                <table class="table align-middle mb-0 user-table">
                    <caption class="visually-hidden">Órdenes de dieta recibidas en tiempo real</caption>
                    <thead><tr><th scope="col">Hora</th><th scope="col">Paciente</th><th scope="col">Ubicación</th><th scope="col">Régimen</th><th scope="col">Estado</th></tr></thead>
                    <tbody id="ordenes" aria-live="polite">
                    <tr id="sin-ordenes"><td colspan="5" class="text-center text-body-secondary py-5">Aún no se han recibido órdenes.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script defer th:src="@{/js/fechas-locales.js}"></script>
<script defer th:src="@{/js/cocina-ordenes.js}" th:attr="data-eventos=@{/cocina/ordenes/eventos}" id="script-ordenes"></script>
</body>
</html>
