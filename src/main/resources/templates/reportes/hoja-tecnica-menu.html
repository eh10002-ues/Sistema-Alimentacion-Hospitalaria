<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Hoja técnica de gramajes por ración')}"></head>
<body class="app-layout">
<th:block th:replace="~{fragments/layout :: header('reporte-hoja-tecnica-menu')}"></th:block>
<div class="app-content">
    <main id="contenido-principal" class="app-main">
        <div class="page-heading">
            <p class="page-eyebrow mb-2">REPORTES · RD-02</p>
            <h1 class="mb-2">Hoja técnica de gramajes por ración</h1>
        </div>

        <form class="card card-body mb-3" th:action="@{/reportes/hoja-tecnica-menu}" method="get">
            <div class="row g-3 align-items-end">
                <div class="col-md">
                    <label for="menuId" class="form-label">Menú</label>
                    <select id="menuId" name="menuId" class="form-select" required>
                        <option value="" th:selected="${menuSeleccionado == null}" disabled>Seleccione un menú</option>
                        <option th:each="menu : ${menus}" th:value="${menu.id}" th:text="${menu.etiqueta}"
                                th:selected="${menu.id == menuSeleccionado}"></option>
                    </select>
                </div>
                <div class="col-md-auto">
                    <button type="submit" class="btn btn-primary">Consultar</button>
                </div>
            </div>
        </form>

        <section th:if="${reporte != null}" class="card card-body" aria-label="Resultado del reporte">
            <th:block th:replace="~{reportes/fragments :: encabezado(${reporte.encabezado})}"></th:block>
            <dl class="row mb-3">
                <dt class="col-sm-2">Menú</dt><dd class="col-sm-4 fw-semibold" th:text="${reporte.menu}"></dd>
                <dt class="col-sm-2">Tipo de dieta</dt><dd class="col-sm-4" th:text="${reporte.tipoDieta}"></dd>
            </dl>

            <div class="table-responsive mb-4" th:each="comida : ${reporte.comidas}">
                <table class="table align-middle mb-0" data-reporte-tabla>
                    <caption class="caption-top fw-semibold text-body" th:text="${comida.comida}"></caption>
                    <thead>
                    <tr>
                        <th>Comida</th><th>Hora</th><th>Platillo</th><th>Insumo</th>
                        <th class="text-end">Cantidad por ración</th><th>Unidad</th>
                        <th class="text-end">Costo unitario</th><th class="text-end">Costo</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(comida.filas)}">
                        <td colspan="8" class="text-center text-body-secondary py-4">El menú no tiene insumos registrados.</td>
                    </tr>
                    <tr th:each="fila : ${comida.filas}">
                        <td th:text="${fila.comida}"></td>
                        <td th:text="${#temporals.format(fila.hora, 'hh:mm a')}"></td>
                        <td th:text="${fila.platillo}"></td>
                        <td th:text="${fila.insumo}"></td>
                        <td class="text-end" th:text="${fila.cantidad}"></td>
                        <td th:text="${fila.unidad}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(fila.costoUnitario, 1, 2)}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(fila.costo, 1, 2)}"></td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr>
                        <th colspan="7" th:text="|Costo total de ${comida.comida}|">Costo total</th>
                        <td class="text-end" th:text="${#numbers.formatDecimal(comida.costoTotal, 1, 2)}"></td>
                    </tr>
                    </tfoot>
                </table>
            </div>

            <div class="table-responsive">
                <table class="table align-middle mb-0" data-reporte-tabla>
                    <tfoot>
                    <tr>
                        <th colspan="7">Costo total por ración completa</th>
                        <td class="text-end" th:text="${#numbers.formatDecimal(reporte.costoTotal, 1, 2)}"></td>
                    </tr>
                    </tfoot>
                </table>
            </div>
        </section>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<th:block th:replace="~{reportes/fragments :: scripts}"></th:block>
</body>
</html>
