<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head('Reportes generales')}"></head>
<body class="app-layout">
<th:block th:replace="~{fragments/layout :: header('reportes')}"></th:block>
<div class="app-content">
    <main id="contenido-principal" class="app-main">
        <div class="page-heading">
            <p class="page-eyebrow mb-2">REPORTES</p>
            <h1 class="mb-2">Reportes generales</h1>
            <p class="text-body-secondary mb-0">Reportes autorizados para su rol.</p>
        </div>
        <div class="row g-4">
            <section class="col-md-6" th:each="reporte : ${reportes}">
                <div class="card h-100">
                    <div class="card-body">
                        <h2 class="h5" th:text="${reporte.titulo}"></h2>
                        <p class="text-body-secondary" th:text="${reporte.descripcion}"></p>
                        <a class="btn btn-primary" th:href="@{${reporte.tipo.ruta}}">Consultar reporte</a>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
